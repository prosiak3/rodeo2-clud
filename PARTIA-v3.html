<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Klikalna makieta MVP platformy okazji hurtowych B2B: producent → sklep. Wersja demonstracyjna — fikcyjne dane i płatności.">
<title>Okazje B2B — prototyp</title>
<style>
:root{
  --bg:#f3f4f2;--surface:#ffffff;--ink:#1a1f1c;--muted:#5d675f;--line:#dfe3df;--line-strong:#c3cac4;
  --accent:#0b6b4c;--accent-hover:#08553c;--accent-soft:#e2f1ea;
  --warn:#8a5300;--warn-bg:#fff5df;--warn-line:#efd7a5;
  --danger:#b3261e;--danger-bg:#fdecea;--danger-line:#f2c4c0;
  --ok:#0b6b4c;--ok-bg:#e2f1ea;--ok-line:#b9dccb;
  --info-bg:#eef3f1;--info-line:#d3ded8;
  --radius:14px;--tap:48px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:24px;font-weight:700}
h2{font-size:17px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1b5fd9;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;gap:12px;align-items:baseline}

/* ---------- szkielet ---------- */
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:34px;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding:0 16px;height:58px;display:flex;align-items:center;gap:10px}
.back{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:-10px;border-radius:10px;color:var(--ink);text-decoration:none;border:0;background:none;cursor:pointer}
.back:hover{background:var(--bg)}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--ink);text-decoration:none;letter-spacing:-.02em}
.brand-mark{width:22px;height:22px;border-radius:7px;background:var(--accent);position:relative;flex:none}
.brand-mark::after{content:"";position:absolute;left:6px;top:6px;width:10px;height:10px;border-radius:3px;background:#fff;opacity:.9}
.brand-sub{color:var(--accent);font-weight:600;margin-left:2px}
.nav-desktop{display:none;gap:4px;margin-left:16px}
.nav-desktop a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;white-space:nowrap}
.nav-desktop a svg{width:18px;height:18px}
.nav-desktop a:hover{background:var(--bg)}
.nav-desktop a.active{background:var(--accent-soft);color:var(--accent)}
.nav-desktop a.nav-cta{color:var(--accent);border:1px solid var(--line-strong)}
.ctx{margin-left:auto;text-align:right;line-height:1.2;min-width:0}
.ctx strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
.ctx span{display:none;font-size:12px;color:var(--muted)}
.main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:16px 16px 32px}
.main:focus{outline:none}
.app.has-tabbar .main{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}
.tabbar a svg{width:24px;height:24px}
.tabbar a.active{color:var(--accent)}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.page-head p{margin-top:4px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.section-title h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}

/* ---------- komponenty ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card+.card{margin-top:12px}
.grid{display:grid;gap:12px}
.btn{min-height:var(--tap);padding:0 18px;border-radius:12px;font-weight:600;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:var(--surface);color:var(--ink);transition:background .12s}
.btn svg{width:20px;height:20px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{border-color:var(--line-strong)}
.btn-secondary:hover{background:var(--bg)}
.btn-ghost{background:transparent;color:var(--accent)}
.btn-ghost:hover{background:var(--accent-soft)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-line)}
.btn-block{width:100%}
.btn-lg{min-height:56px;font-size:17px}
.btn[aria-disabled="true"],.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.actions .btn{flex:1 1 auto}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1.5}
.b-active{background:var(--ok-bg);color:var(--ok)}
.b-ended{background:#e9ebe9;color:#4b534e}
.b-draft{background:#e9edfb;color:#3949a8}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-danger{background:var(--danger-bg);color:var(--danger)}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--info-line);background:var(--info-bg);align-items:flex-start}
.notice svg{width:20px;height:20px;flex:none;margin-top:1px}
.n-warn{background:var(--warn-bg);border-color:var(--warn-line);color:#553300}
.n-danger{background:var(--danger-bg);border-color:var(--danger-line);color:#6e1a15}
.n-ok{background:var(--ok-bg);border-color:var(--ok-line);color:#0a4a34}
.notice .actions{margin-top:10px}
.kv{display:grid;grid-template-columns:minmax(110px,36%) 1fr;gap:8px 12px;font-size:15px}
.kv dt{color:var(--muted);margin:0}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.divider{border:0;border-top:1px solid var(--line);margin:14px 0}
.progress{height:8px;background:#e6e9e6;border-radius:999px;overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;background:var(--accent);border-radius:999px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--radius)}
.err{display:flex;gap:6px;align-items:flex-start;color:var(--danger);font-size:14px;margin-top:8px;font-weight:600}
.err svg{width:18px;height:18px;flex:none;margin-top:2px}

/* ilustracje produktów */
.art{display:block;width:100%;height:100%;object-fit:cover}
.thumb{width:72px;height:72px;border-radius:12px;overflow:hidden;flex:none;background:#eef1ee}
.thumb img,.hero-art img,.t-art img{width:100%;height:100%;object-fit:cover;display:block}
.art-empty{background:#e6e9e6}
.hero-art{width:100%;aspect-ratio:2/1;max-height:170px;border-radius:var(--radius);overflow:hidden;background:#eef1ee;margin-bottom:12px}

/* karty ofert (sklep) */
.offer-card{display:flex;gap:14px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;transition:border-color .12s,box-shadow .12s}
.offer-card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.offer-card.is-ended{opacity:.7}
.oc-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.oc-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.oc-top .oc-ends{white-space:nowrap}
.oc-name{font-size:17px;font-weight:700;line-height:1.25}
.oc-variant{font-weight:400;color:var(--muted);font-size:14px}
.oc-bottom{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.oc-price{font-size:20px;font-weight:800;letter-spacing:-.01em}
.oc-price small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.oc-meta{font-size:13px;color:var(--muted)}

/* oferta (sklep) */
.offer-title{margin-bottom:12px}
.offer-title .seller{color:var(--muted);font-size:15px}
.price-lines{display:grid;gap:4px}
.price{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.price small{font-size:16px;font-weight:600;color:var(--muted);letter-spacing:0}
.price-line{font-size:16px;font-weight:600}
.price-line .muted{font-weight:400}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fact{background:var(--bg);border-radius:12px;padding:10px 12px}
.fact b{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.fact span{font-weight:600;font-size:15px}
details.more{border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-top:12px;background:var(--surface)}
details.more summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:600;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);margin-right:12px;transition:transform .15s}
details.more[open] summary::before{transform:rotate(45deg)}
details.more>div{padding:4px 0 12px}
.buy-panel{margin:12px 0 0;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.buy-panel h2{font-size:15px;margin-bottom:8px}
.stepper{display:flex;border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;background:var(--surface)}
.stepper button{width:64px;min-height:56px;border:0;background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.stepper button:hover{background:#e7eae7}
.stepper button svg{width:24px;height:24px}
.stepper input{flex:1;min-width:0;border:0;text-align:center;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 6px}
.stepper input:focus{outline:none;background:#f6fbf8}
.stepper.invalid{border-color:var(--danger)}
.stepper-unit{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.chip:hover{background:var(--bg)}
.totals{margin-top:12px;font-size:14px;color:var(--muted)}
.totals .spread+.spread{margin-top:2px}
.cta-row{position:sticky;bottom:0;z-index:20;background:var(--surface);margin:12px -16px -16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.07);display:flex;align-items:center;gap:12px;border-radius:0 0 var(--radius) var(--radius)}
.cta-row .sum{flex:1;min-width:0;line-height:1.2}
.cta-row .sum b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.cta-row .sum span{font-size:12px;color:var(--muted)}
.cta-row .btn{flex:none;min-height:52px;padding:0 18px}
body.kb .cta-row{position:static;box-shadow:none}
.cta-note{font-size:13px;color:var(--muted);margin-top:8px}

/* formularze */
.field{margin-bottom:14px}
.field label,.field .lbl{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field .hint{font-size:13px;color:var(--muted);margin-top:6px}
.input,.textarea{width:100%;min-height:48px;border:1px solid var(--line-strong);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink)}
.textarea{min-height:72px;resize:vertical;line-height:1.4}
.field.invalid .input,.field.invalid .textarea{border-color:var(--danger);border-width:2px}
.with-unit{position:relative}
.with-unit .input{padding-right:96px}
.with-unit .unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.big .input{font-size:24px;font-weight:700;min-height:60px;font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line-strong);border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;margin:0;background:var(--surface)}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg label:has(input:focus-visible){outline:3px solid #1b5fd9;outline-offset:2px}
.seg.vert{flex-direction:column;align-items:stretch}
.seg.vert label{border-radius:12px;min-height:48px;justify-content:space-between}
.seg.vert label small{font-weight:400;color:var(--muted)}

/* katalog producenta */
.search{position:relative;margin-bottom:12px}
.search .input{padding-left:40px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;cursor:pointer;text-decoration:none;color:inherit;min-height:44px}
.tile:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.tile .t-art{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#eef1ee;margin-bottom:8px}
.tile b{font-size:15px;line-height:1.25}
.tile span{font-size:13px;color:var(--muted)}
.tile .t-last{margin-top:4px;font-size:12px;color:var(--muted)}

/* karta oferty producenta */
.prod-head{display:flex;gap:14px;align-items:center}
.prod-head .thumb{width:84px;height:84px}
.prod-head h1{font-size:20px}
.cond{display:flex;align-items:center;gap:10px;min-height:52px;padding:4px 0;border-top:1px solid var(--line)}
.cond:first-of-type{border-top:0}
.cond .c-ico{width:34px;height:34px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
.cond .c-ico svg{width:18px;height:18px}
.cond .c-txt{flex:1;min-width:0;font-size:15px}
.cond .c-txt b{font-weight:600}
.cond .c-txt small{display:block;color:var(--muted);font-size:13px}
.cond .c-edit{min-height:40px;padding:0 12px;border-radius:10px;border:0;background:transparent;color:var(--accent);font-weight:700;cursor:pointer}
.cond .c-edit:hover{background:var(--accent-soft)}
.cond.invalid .c-txt b{color:var(--danger)}
.panel{background:var(--bg);border-radius:12px;padding:12px;margin:0 0 10px}
.panel .actions{margin-top:10px}
.panel .actions .btn{min-height:42px}
.pub-sum{font-size:14px;color:var(--muted);margin-top:8px}

/* układ karty oferty */
.form-layout aside{display:none}
.preview-frame .offer-card{box-shadow:none}

/* zamówienia */
.order-card{display:flex;gap:12px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.order-card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.order-card .thumb{width:56px;height:56px}
.status-hero{text-align:center;padding:16px 12px 8px}
.status-hero .ico{width:64px;height:64px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}
.status-hero .ico svg{width:32px;height:32px}
.status-hero.ok .ico{background:var(--ok-bg);color:var(--ok)}
.status-hero.bad .ico{background:var(--danger-bg);color:var(--danger)}
.status-hero.wait .ico{background:var(--info-bg);color:var(--muted)}
.spinner{width:28px;height:28px;border:3px solid #cfd6d2;border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.oc-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.oc-actions .btn{min-height:40px;padding:0 12px;font-size:14px}

/* nakładka płatności */
.overlay{position:fixed;inset:0;z-index:85;background:rgba(20,26,23,.45);display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.25);animation:sheetin .22s ease-out}
@keyframes sheetin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .actions{margin-top:14px}

/* push (symulacja powiadomienia) */
.push{position:fixed;top:42px;left:50%;transform:translateX(-50%);width:min(430px,calc(100% - 20px));background:#1f2937;color:#fff;border-radius:16px;padding:12px 12px 12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.28);z-index:80;display:flex;gap:12px;align-items:flex-start;animation:pushin .28s ease-out}
@keyframes pushin{from{transform:translate(-50%,-120%);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.push-body{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;display:flex;gap:12px;align-items:flex-start}
.push-icon{width:36px;height:36px;border-radius:9px;background:var(--accent);flex:none;display:flex;align-items:center;justify-content:center}
.push-icon svg{width:20px;height:20px}
.push-text{min-width:0}
.push-app{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.7;display:flex;justify-content:space-between;gap:8px}
.push-title{font-weight:700;font-size:15px;margin-top:2px}
.push-line{font-size:14px;opacity:.9}
.push-close{width:36px;height:36px;border:0;background:rgba(255,255,255,.12);border-radius:50%;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.push-close svg{width:18px;height:18px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:#1f2937;color:#fff;padding:12px 16px;border-radius:12px;z-index:75;max-width:min(480px,calc(100% - 24px));font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* pasek demonstracyjny — poza aplikacją */
.demo-bar{position:sticky;top:0;z-index:95;height:34px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#fff3d6;border-bottom:2px dashed #b36b00;color:#5a3600;font-size:13px}
.demo-bar .demo-tag{font-weight:800;letter-spacing:.08em;display:inline-flex;align-items:center;gap:6px}
.demo-bar .demo-tag::before{content:"";width:8px;height:8px;border-radius:50%;background:#e08a00}
.demo-bar .demo-who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.demo-bar .demo-open{margin-left:auto;min-height:28px;padding:0 12px;border-radius:8px;border:1px solid #b36b00;background:#fff;color:#5a3600;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.demo-panel{position:absolute;right:8px;top:38px;width:min(340px,calc(100vw - 16px));background:#fffaf0;border:2px dashed #7a4b00;border-radius:14px;padding:14px;box-shadow:0 12px 32px rgba(0,0,0,.2);color:#3a2400;font-size:14px}
.demo-panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#7a4b00;margin-bottom:10px}
.demo-panel .btn{min-height:42px;font-size:14px}
.demo-panel .seg label{background:#fff}
.demo-panel .seg label:has(input:checked){background:#7a4b00;border-color:#7a4b00;color:#fff}
.demo-panel .check{display:flex;gap:10px;align-items:center;min-height:44px;font-size:14px;cursor:pointer}
.demo-panel .check input{width:20px;height:20px;margin:0}
.demo-panel .demo-note{font-size:12px;color:#7a4b00;margin-top:8px;line-height:1.35}

/* ---------- desktop ---------- */
@media (min-width:900px){
  .topbar-in{height:64px}
  .nav-desktop{display:flex}
  .tabbar{display:none}
  .app.has-tabbar .main{padding-bottom:48px}
  .ctx span{display:block}
  .ctx strong{max-width:none}
  .main{padding:28px 24px 48px}
  h1{font-size:28px}
  .grid-2{grid-template-columns:1fr 1fr}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .detail{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
  .buy-panel{position:sticky;top:122px;margin:0;padding:18px;box-shadow:var(--shadow)}
  .cta-row{position:static;margin:12px 0 0;padding:0;border:0;box-shadow:none;flex-direction:column;align-items:stretch}
  .cta-row .sum{text-align:left}
  .cta-row .btn{min-height:56px;font-size:17px}
  .overlay{align-items:center;padding:24px}
  .sheet{border-radius:20px;animation:none}
  .actions .btn{flex:0 1 auto;min-width:160px}
  .prod-head h1{font-size:24px}
  .form-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
  .form-layout aside{display:block;position:sticky;top:122px}
  .hero-art{max-height:300px}
}
@media (max-width:380px){
  .price{font-size:30px}
  .facts{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){
  .push,.sheet{animation:none}.spinner{animation-duration:2s}
}

(function(){
'use strict';
/* ==========================================================================
   Okazje B2B — klikalna makieta (producent → sklep), iteracja 2.
   Wszystko lokalnie: fikcyjne dane, symulowane powiadomienia i płatności.
   ========================================================================== */
const KEY='okazje-b2b-proto-v3';
const HOUR=3600000, MIN=60000, DAY=86400000;
const NBSP=' ';
const SUP_ID='sup1', SHOP_ID='shop1';

/* ---------- pamięć ---------- */
const mem={};
const storage={
  get(){ try{ return localStorage.getItem(KEY); }catch(e){ return mem[KEY]||null; } },
  set(v){ try{ localStorage.setItem(KEY,v); }catch(e){ mem[KEY]=v; } }
};

/* ---------- pomocnicze ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
function zl(gr){ const neg=gr<0; gr=Math.abs(Math.round(gr)); const int=Math.floor(gr/100); const frac=String(gr%100).padStart(2,'0'); const intStr=String(int).replace(/\B(?=(\d{3})+(?!\d))/g,NBSP); return (neg?'−':'')+intStr+','+frac+NBSP+'zł'; }
function zlShort(gr){ return gr%100===0? String(Math.round(gr/100)).replace(/\B(?=(\d{3})+(?!\d))/g,NBSP)+NBSP+'zł' : zl(gr); }
function plural(n,forms){ n=Math.abs(n); if(n===1) return forms[0]; const m10=n%10,m100=n%100; if(m10>=2&&m10<=4&&!(m100>=12&&m100<=14)) return forms[1]; return forms[2]; }
function qtyLabel(n,pack){ return n+NBSP+plural(n,pack.names); }
function fmtNum(x){ return Number(x).toLocaleString('pl-PL'); }
function pad(n){ return String(n).padStart(2,'0'); }
function fmtTime(ts){ const d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDate(ts){ const d=new Date(ts); return d.getDate()+'.'+pad(d.getMonth()+1); }
function fmtDateTime(ts){ return fmtDate(ts)+', '+fmtTime(ts); }
const DOW=['niedz.','pon.','wt.','śr.','czw.','pt.','sob.'];
function dayDiff(ts,now){ const a=new Date(ts),b=new Date(now); a.setHours(0,0,0,0); b.setHours(0,0,0,0); return Math.round((a-b)/DAY); }
function endsLabel(ts,now){ const dd=dayDiff(ts,now); if(dd===0) return 'dziś do '+fmtTime(ts); if(dd===1) return 'jutro do '+fmtTime(ts); if(dd===-1) return 'wczoraj, '+fmtTime(ts); return (dd<0?'':'do ')+DOW[new Date(ts).getDay()]+' '+fmtDate(ts)+', '+fmtTime(ts); }
function dayLabel(ts,now){ const dd=dayDiff(ts,now); if(dd===0) return 'dziś'; if(dd===1) return 'jutro'; return DOW[new Date(ts).getDay()]+' '+fmtDate(ts); }
function countdown(ts,now){ const ms=ts-now; if(ms<=0) return 'zakończona'; const m=Math.ceil(ms/MIN); if(m<60) return 'za '+m+NBSP+'min'; const h=Math.floor(m/60); if(h<24) return 'za '+h+NBSP+'h'+(m%60?' '+(m%60)+NBSP+'min':''); const d=Math.floor(h/24); return 'za '+d+NBSP+plural(d,['dzień','dni','dni'])+(h%24?' '+(h%24)+NBSP+'h':''); }
function toLocalInput(ts){ const d=new Date(ts); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }
function parsePrice(s){ if(s==null) return NaN; const t=String(s).trim().replace(/\s/g,'').replace(',','.'); if(!/^\d+(\.\d{1,2})?$/.test(t)) return NaN; return Math.round(parseFloat(t)*100); }
function priceInput(gr){ return gr==null?'':(gr/100).toFixed(2).replace('.',','); }
function unitsOf(units,unit){ return fmtNum(units)+NBSP+unit; }
function packName(pack,cap){ const n=pack.names[0]; return cap?n.charAt(0).toUpperCase()+n.slice(1):n; }
function nextWorkday(now,plus){ const d=new Date(now); d.setHours(0,0,0,0); let n=plus||1; while(n>0){ d.setDate(d.getDate()+1); if(d.getDay()!==0&&d.getDay()!==6) n--; } return d.getTime(); }

function fulfilLong(fl,now){ return fl.name+' — '+dayLabel(fl.at,now)+' ('+DOW[new Date(fl.at).getDay()]+' '+fmtDate(fl.at)+'), '+fl.slot+(fl.cost?'. Koszt: '+zl(fl.cost)+' netto':'. Bez dopłaty'); }
function makeOrder(o,qty,buyer,at){

    fulfil:clone(o.fulfil),status:'pending',createdAt:at,paidAt:null,attempts:[]};
}

const offer=id=>S.offers.find(o=>o.id===id);
const orderById=id=>S.orders.find(o=>o.id===id);
const product=id=>S.supplier.products.find(p=>p.id===id);
const group=id=>S.supplier.groups.find(g=>g.id===id);
const fulfilOf=id=>S.supplier.fulfils.find(f=>f.id===id);
function remaining(o){ return o.pool-o.sold-(o.reserved||0); }
function offerState(o,now){ if(o.status==='draft') return 'draft'; if(o.status==='closed') return 'closed'; if(now>=o.endsAt) return 'expired'; const r=remaining(o); if(r<=0) return (o.reserved>0)?'reserved':'soldout'; if(r<o.min) return 'lowstock'; return 'active'; }
const STATE={draft:['Zapisana na później','b-draft'],closed:['Zakończona','b-ended'],expired:['Zakończona','b-ended'],soldout:['Wyprzedane','b-ended'],reserved:['Chwilowo rezerwowane','b-warn'],lowstock:['Mniej niż minimum','b-warn'],active:['Aktywna','b-active']};
function badge(st){ const s=STATE[st]; return '<span class="badge '+s[1]+'">'+esc(s[0])+'</span>'; }
function calc(o,qty){ const units=qty*o.pack.size; const net=Math.round(units*o.priceNet); const vat=Math.round(net*o.vat/100); const delivery=(qty>0&&o.fulfil&&o.fulfil.cost)?o.fulfil.cost:0; const deliveryVat=Math.round(delivery*0.23); return {units,net,vat,delivery,deliveryVat,gross:net+vat+delivery+deliveryVat}; }
function shopSees(o){ if(o.status==='draft') return false; if(o.supplierId===SUP_ID) return S.shop.groups.includes(o.groupId); return !!o.visibleToShop; }
function boughtByShop(o){ return S.orders.filter(x=>x.offerId===o.id&&x.buyer.id===SHOP_ID&&x.status==='paid').reduce((a,x)=>a+x.qty,0); }
function shopMax(o){ if(!o.max) return null; return Math.max(0,o.max-boughtByShop(o)); }
function qtyCheck(o,raw){
  const rem=remaining(o), max=shopMax(o); const t=String(raw==null?'':raw).trim();
  if(t===''||!/^\d+$/.test(t)) return {ok:false,msg:'Podaj liczbę '+o.pack.names[2]+'.'};
  const n=parseInt(t,10);
  if(n<o.min) return {ok:false,msg:'Minimum to '+qtyLabel(o.min,o.pack)+'.'};
  if(n>rem) return {ok:false,msg:'Dostępne '+(rem===1?'jest':'są')+' tylko '+qtyLabel(rem,o.pack)+'.'};
  if(max!==null&&n>max) return {ok:false,msg:'Limit dla Twojego sklepu: jeszcze '+qtyLabel(max,o.pack)+'.'};
  return {ok:true,n};
}

let ROUTE='#/shop/offers';
function parseRoute(){ const h=ROUTE.replace(/^#\/?/,''); const [path,q]=h.split('?'); const parts=path.split('/').filter(Boolean); return {role:parts[0]||'',page:parts[1]||'',id:parts[2]||'',query:Object.fromEntries(new URLSearchParams(q||''))}; }
function go(hash){ if(S.ui.pay&&S.ui.pay.phase==='failed'&&hash!==ROUTE) S.ui.pay=null; ROUTE=hash; S.ui.route=hash; storage.set(JSON.stringify(S)); try{ if(location.hash!==hash) history.pushState(null,'',hash); }catch(e){} render(); }
let lastRouteKey=null; let focusSearch=false;

/* ---------- render ---------- */
function render(){
  const r=parseRoute(); const now=Date.now();
  if(r.role!=='shop'&&r.role!=='supplier'){ go('#/shop/offers'); return; }
  let out;
  if(r.role==='shop'){
    switch(r.page){
      case 'offer': out=viewShopOffer(r,now); break;
      case 'orders': out=viewOrders(r,'shop',now); break;
      case 'order': out=viewOrder(r,'shop',now); break;
      case 'history': out=viewHistory(r,now); break;
      default: out=viewShopOffers(r,now);
    }
  } else {
    switch(r.page){
      case 'new': out=viewCatalog(r,now); break;
      case 'compose': out=viewCompose(r,now); break;
      case 'offer': out=viewSupplierOffer(r,now); break;
      case 'orders': out=viewOrders(r,'supplier',now); break;
      case 'order': out=viewOrder(r,'supplier',now); break;
      default: out=viewSupplierOffers(r,now);
    }
  }
  if(out.redirect){ go(out.redirect); return; }
  $('#app').innerHTML=layout(r,out);
  const key=r.role+'/'+r.page+'/'+r.id;
  if(key!==lastRouteKey){ lastRouteKey=key; window.scrollTo(0,0); const m=$('#main'); if(m) m.focus({preventScroll:true}); }
  if(out.after) out.after();
  renderOverlay();

}

/* ---------- płatność (symulacja, nakładka na ekranie oferty) ---------- */
let payTimer=null;
function startPay(o){
  const chk=qtyCheck(o,S.ui.qtyByOffer[o.id]);
  if(!chk.ok){ patchBuy(o); const i=$('#qty-input'); if(i) i.focus(); return; }
  if(S.ui.pay&&['processing','waiting'].includes(S.ui.pay.phase)) return; /* bez duplikatów po wielokrotnym kliknięciu */
  const now=Date.now(); const st=offerState(o,now);
  if(st!=='active'){ render(); return; }
  let ord=null; const prev=S.ui.pay&&S.ui.pay.offerId===o.id&&S.ui.pay.orderId?orderById(S.ui.pay.orderId):null;
  if(prev&&prev.status==='failed'&&prev.qty===chk.n) ord=prev;
  if(!ord){ ord=makeOrder(o,chk.n,S.shop,now); ord.id='ZAM-'+(S.seq.order++); S.orders.unshift(ord); }
  ord.status='pending'; o.reserved=(o.reserved||0)+chk.n;
  S.ui.pay={offerId:o.id,qty:chk.n,orderId:ord.id,phase:'processing',token:Math.random().toString(36).slice(2)};
  save(); render(); runPayTimers(S.ui.pay.token);
}
function runPayTimers(token){
  clearTimeout(payTimer);
  payTimer=setTimeout(()=>{ const p=S.ui.pay; if(!p||p.token!==token) return; p.phase='waiting'; save(); renderOverlay();
    payTimer=setTimeout(()=>finishPay(token),1200); },1300);
}
function finishPay(token){
  payTimer=null; const p=S.ui.pay; if(!p||p.token!==token||p.phase!=='waiting') return;
  const o=offer(p.offerId), ord=orderById(p.orderId), now=Date.now();
  const fail=!!S.ui.failNextPayment; S.ui.failNextPayment=false;
  o.reserved=Math.max(0,(o.reserved||0)-p.qty);
  if(fail){ ord.status='failed'; ord.attempts.push({at:now,result:'failed'}); p.phase='failed'; save(); renderOverlay(); render(); return; }
  o.sold+=p.qty; ord.status='paid'; ord.paidAt=now; ord.attempts.push({at:now,result:'paid'});
  S.ui.pay=null; delete S.ui.qtyByOffer[o.id]; save();
  const r=parseRoute();
  if(r.role==='shop'&&r.page==='offer'&&r.id===o.id) go('#/shop/order/'+ord.id+'?new=1'); else { renderOverlay(); toast('Płatność potwierdzona. Zamówienie '+ord.id+' jest w zakładce Zamówienia.'); }
}
function cancelPay(){ const p=S.ui.pay; if(!p) return; if(p.phase==='failed'){ S.ui.pay=null; save(); render(); } }
function renderOverlay(){
  const L=$('#overlay-layer'); const p=S.ui.pay; const r=parseRoute();
  if(!p||!(r.role==='shop'&&r.page==='offer'&&r.id===p.offerId)){ L.innerHTML=''; return; }
  const o=offer(p.offerId); const c=calc(o,p.qty);
  if((p.phase==='processing'||p.phase==='waiting')&&!payTimer){ p.phase='processing'; p.token=Math.random().toString(36).slice(2); save(); runPayTimers(p.token); }
  let inner='';
  if(p.phase==='processing'||p.phase==='waiting'){

/* ---------- krok 2: karta oferty ---------- */
function blankForm(p){ return {draftId:null,fromId:null,productId:p.id,price:priceInput(p.lastPriceNet),pool:'',min:p.defaultMin,endMode:'4h',endCustom:'',fulfilId:S.supplier.fulfils[0].id,groupId:S.supplier.groups[0].id,max:'',bestBefore:'',note:'',open:null,errors:{},lowPriceConfirmed:false}; }
function ensureForm(r){
  const p=product(r.id); if(!p) return null;
  let f=S.ui.form;
  if(r.query.draft){ const d=offer(r.query.draft); if(d&&d.status==='draft'&&(!f||f.draftId!==d.id)){ f=Object.assign(blankForm(p),clone(d.form),{draftId:d.id,errors:{},open:null,lowPriceConfirmed:false}); S.ui.form=f; } }
  else if(r.query.from){ const src=offer(r.query.from); if(src&&(!f||f.fromId!==src.id)){ f=blankForm(p); f.fromId=src.id; f.price=priceInput(src.priceNet); f.min=src.min; f.groupId=group(src.groupId)?src.groupId:f.groupId; f.max=src.max?String(src.max):''; /* ilość i termin przydatności podaje się na nowo */ S.ui.form=f; } }
  if(!f||f.productId!==p.id){ f=blankForm(p); S.ui.form=f; }
  return f;
}
function endOptions(now){ const o=[{id:'4h',label:'Za 4 godziny',sub:'do '+fmtTime(now+4*HOUR)}]; const d=new Date(now); d.setHours(16,0,0,0); if(d.getTime()-now>HOUR) o.push({id:'today',label:'Dziś do 16:00',sub:''}); o.push({id:'tomorrow',label:'Jutro do 12:00',sub:''},{id:'3d',label:'Za 3 dni',sub:'do '+DOW[new Date(now+3*DAY).getDay()]+' '+fmtDate(now+3*DAY)+', '+fmtTime(now)},{id:'custom',label:'Inny termin',sub:''}); return o; }
function computeEnd(f,now){ switch(f.endMode){ case '4h': return now+4*HOUR; case 'today': { const d=new Date(now); d.setHours(16,0,0,0); return d.getTime(); } case 'tomorrow': { const d=new Date(now); d.setDate(d.getDate()+1); d.setHours(12,0,0,0); return d.getTime(); } case '3d': return now+3*DAY; case 'custom': return f.endCustom?new Date(f.endCustom).getTime():NaN; } return NaN; }
function validateForm(f,now){
  const e={}; const p=product(f.productId);
  const price=parsePrice(f.price); if(!(price>0)) e.price='Podaj cenę netto za '+p.unit+', np. 14,90.';
  const pool=/^\d+$/.test(String(f.pool).trim())?parseInt(f.pool,10):NaN; if(!(pool>=1)) e.pool='Podaj, ile '+p.pack.names[2]+' sprzedajesz w tej ofercie.';
  const min=parseInt(f.min,10); if(!(min>=1)) e.min='Minimum musi wynosić co najmniej 1.'; else if(pool>=1&&min>pool) e.min='Minimum ('+min+') jest większe niż ilość do sprzedaży ('+pool+').';
  const end=computeEnd(f,now); if(!Number.isFinite(end)) e.end='Podaj termin zakończenia.'; else if(end<=now) e.end='Ten termin już minął.'; else if(end>now+7*DAY) e.end='Oferta może trwać najwyżej 7 dni.';
  if(!fulfilOf(f.fulfilId)) e.fulfil='Wybierz sposób dostawy lub odbioru.';
  if(!group(f.groupId)) e.group='Wybierz grupę sklepów.';
  if(String(f.max).trim()!==''){ const mx=/^\d+$/.test(String(f.max).trim())?parseInt(f.max,10):NaN; if(!(mx>=1)) e.max='Podaj liczbę całkowitą albo zostaw puste.'; else if(min>=1&&mx<min) e.max='Maksimum nie może być mniejsze niż minimum ('+min+').'; }
  return e;
}
function priceWarning(f){ const p=product(f.productId); const price=parsePrice(f.price); if(!p||!p.lastPriceNet||!(price>0)) return null; const ratio=price/p.lastPriceNet; if(ratio<0.6) return {kind:'low',price,last:p.lastPriceNet,unit:p.unit}; if(ratio>1.6) return {kind:'high',price,last:p.lastPriceNet,unit:p.unit}; return null; }
function offerFromForm(f,now){
  const p=product(f.productId); const g=group(f.groupId); const fl=fulfilOf(f.fulfilId);
  return {id:'o'+(S.seq.offer++),supplierId:SUP_ID,supplierName:S.supplier.name,supplierAddress:S.supplier.address,supplierContact:{phone:S.supplier.phone,email:S.supplier.email},
    productId:p.id,name:p.name,variant:p.variant,art:p.art,unit:p.unit,pack:p.pack,vat:p.vat,info:p.info,priceNet:parsePrice(f.price),pool:parseInt(f.pool,10),sold:0,reserved:0,min:parseInt(f.min,10),max:String(f.max).trim()?parseInt(f.max,10):null,
    endsAt:computeEnd(f,now),createdAt:now,fulfil:fulfilSnapshot(fl,now),groupId:g.id,groupName:g.name,groupCount:g.count,status:'active',bestBefore:String(f.bestBefore).trim(),note:String(f.note).trim()};
}

  return '<div class="cond'+inv+'"><div class="c-ico">'+icon+'</div><div class="c-txt"><b>'+text+'</b>'+(sub?'<small>'+sub+'</small>':'')+(f.errors[key]?'<small class="err" style="margin-top:2px">'+esc(f.errors[key])+'</small>':'')+'</div><button type="button" class="c-edit" data-act="cond-open" data-key="'+key+'" aria-expanded="'+(f.open===key?'true':'false')+'">'+(f.open===key?'Gotowe':'Zmień')+'</button></div>'+(f.open===key?condPanel(key,f):'');

  const now=Date.now(); const p=product(f.productId);
  if(key==='min') return '<div class="panel"><div class="field" style="margin:0"><span class="lbl" id="min-l">Minimum zamówienia</span><div class="stepper" style="max-width:240px" role="group" aria-labelledby="min-l"><button type="button" data-act="min-dec" aria-label="Mniej o 1">'+ICON.minus+'</button><input class="num" type="text" inputmode="numeric" value="'+esc(f.min)+'" data-f="min" aria-label="Minimum w '+esc(p.pack.names[2])+'"><button type="button" data-act="min-inc" aria-label="Więcej o 1">'+ICON.plus+'</button></div><p class="hint">'+esc(p.pack.names[2])+' · typowo dla tego produktu: '+p.defaultMin+'</p></div></div>';
  if(key==='end') return '<div class="panel"><div class="seg vert" role="radiogroup" aria-label="Koniec oferty">'+endOptions(now).map(x=>'<label><input type="radio" name="endMode" data-f="endMode" value="'+x.id+'"'+(f.endMode===x.id?' checked':'')+'><span>'+esc(x.label)+'</span><small>'+esc(x.sub)+'</small></label>').join('')+'</div>'+
    (f.endMode==='custom'?'<div class="field" style="margin:10px 0 0"><label for="f-end-custom">Data i godzina</label><input class="input" id="f-end-custom" data-f="endCustom" type="datetime-local" value="'+esc(f.endCustom)+'" min="'+toLocalInput(now)+'" max="'+toLocalInput(now+7*DAY)+'"></div>':'')+'<p class="hint">Najdłużej 7 dni. Oferta kończy się też po sprzedaniu całej ilości.</p></div>';
  if(key==='fulfil') return '<div class="panel"><div class="seg vert" role="radiogroup" aria-label="Dostawa lub odbiór">'+S.supplier.fulfils.map(x=>'<label><input type="radio" name="fulfilId" data-f="fulfilId" value="'+x.id+'"'+(f.fulfilId===x.id?' checked':'')+'><span>'+esc(x.name)+'</span><small>'+esc(dayLabel(nextWorkday(now,x.days),now)+', '+x.slot+(x.cost?' · +'+zlShort(x.cost):' · bez dopłaty'))+'</small></label>').join('')+'</div><p class="hint">Termin liczymy od dnia publikacji.</p></div>';
  if(key==='group') return '<div class="panel"><div class="seg vert" role="radiogroup" aria-label="Odbiorcy">'+S.supplier.groups.map(g=>'<label><input type="radio" name="groupId" data-f="groupId" value="'+g.id+'"'+(f.groupId===g.id?' checked':'')+'><span>'+esc(g.name)+'</span><small>'+g.count+' sklepów</small></label>').join('')+'</div><p class="hint">Oferta jest prywatna — zobaczą ją tylko sklepy z wybranej grupy.</p></div>';
  return '';
}
function viewCompose(r,now){
  const p=product(r.id); if(!p) return {redirect:'#/supplier/new'};
  const f=ensureForm(r); const g=group(f.groupId); const fl=fulfilOf(f.fulfilId); const end=computeEnd(f,now);
  const price=parsePrice(f.price); const pool=/^\d+$/.test(String(f.pool).trim())?parseInt(f.pool,10):NaN;
  const w=priceWarning(f);
  const pub=price>0&&pool>=1?'Opublikuj dla '+g.count+' sklepów':'Opublikuj dla '+g.count+' sklepów';
  let html='<div class="form-layout"><form id="offer-form" novalidate>'+
    '<div class="prod-head" style="margin-bottom:14px"><div class="thumb">'+art(p.art)+'</div><div><h1>'+esc(p.name)+'</h1><p class="muted">'+esc(p.variant)+' · '+esc(packName(p.pack))+' '+unitsOf(p.pack.size,p.unit)+' · VAT '+p.vat+'%</p><p class="small"><a href="#/supplier/new">Zmień produkt</a></p></div></div>'+
    '<div class="card"><div class="grid grid-2" style="gap:12px">'+
      '<div class="field big'+(f.errors.price?' invalid':'')+'" style="margin:0"><label for="f-price">Cena promocyjna netto</label><div class="with-unit"><input class="input num" id="f-price" data-f="price" type="text" inputmode="decimal" value="'+esc(f.price)+'" placeholder="0,00"'+(f.errors.price?' aria-invalid="true" aria-describedby="err-price"':'')+'><span class="unit">zł / '+esc(p.unit)+'</span></div>'+
        '<p class="hint" id="price-hint">'+(price>0?esc(packName(p.pack,true))+' '+unitsOf(p.pack.size,p.unit)+' = '+zl(price*p.pack.size)+' netto'+(p.lastPriceNet?' · ostatnio '+zl(p.lastPriceNet)+'/'+esc(p.unit):''):(p.lastPriceNet?'Ostatnio '+zl(p.lastPriceNet)+'/'+esc(p.unit):'Pierwsza oferta tego produktu'))+'</p>'+(f.errors.price?'<div class="err" id="err-price">'+ICON.warn+'<span>'+esc(f.errors.price)+'</span></div>':'')+'</div>'+
      '<div class="field big'+(f.errors.pool?' invalid':'')+'" style="margin:0"><label for="f-pool">Ilość do sprzedaży</label><div class="with-unit"><input class="input num" id="f-pool" data-f="pool" type="text" inputmode="numeric" value="'+esc(f.pool)+'" placeholder="0"'+(f.errors.pool?' aria-invalid="true" aria-describedby="err-pool"':'')+'><span class="unit">'+esc(p.pack.names[2])+'</span></div>'+
        '<p class="hint" id="pool-hint">'+(pool>=1?'= '+unitsOf(pool*p.pack.size,p.unit)+' · wartość '+zl(pool*p.pack.size*(price>0?price:0))+' netto':'Podaj ilość tej partii')+'</p>'+(f.errors.pool?'<div class="err" id="err-pool">'+ICON.warn+'<span>'+esc(f.errors.pool)+'</span></div>':'')+'</div>'+
    '</div></div>';
  html+='<div class="card" style="padding:4px 16px">'+
    condRow('min',ICON.box,'Minimum: '+qtyLabel(parseInt(f.min,10)||0,p.pack),'',f)+
    condRow('end',ICON.clock,'Oferta ważna: '+(Number.isFinite(end)?esc(endsLabel(end,now)):'podaj termin'),'',f)+
    condRow('fulfil',ICON.truck,fl?esc(fulfilText(fulfilSnapshot(fl,now),now)):'wybierz',fl?esc(fl.name):'',f)+
    condRow('group',ICON.shop,'Odbiorcy: '+(g?esc(g.name)+', '+g.count+' sklepów':'wybierz'),'',f)+
  '</div>';
  html+='<details class="more"'+(f.max||f.bestBefore||f.note||f.errors.max?' open':'')+'><summary>Dodatkowe ustawienia</summary><div>'+
    '<div class="field"><label for="f-bestBefore">Termin przydatności tej partii</label><input class="input" id="f-bestBefore" data-f="bestBefore" type="text" value="'+esc(f.bestBefore)+'" placeholder="np. min. 21 dni od dostawy"><p class="hint">Dotyczy tej partii — nie jest przenoszony z poprzednich ofert.</p></div>'+
    '<div class="field'+(f.errors.max?' invalid':'')+'"><label for="f-max">Maksimum na sklep</label><div class="with-unit"><input class="input num" id="f-max" data-f="max" type="text" inputmode="numeric" value="'+esc(f.max)+'" placeholder="bez limitu"><span class="unit">'+esc(p.pack.names[2])+'</span></div>'+(f.errors.max?'<div class="err">'+ICON.warn+'<span>'+esc(f.errors.max)+'</span></div>':'')+'</div>'+
    '<div class="field" style="margin:0"><label for="f-note">Uwaga dla sklepów</label><input class="input" id="f-note" data-f="note" type="text" value="'+esc(f.note)+'" placeholder="opcjonalnie"></div>'+
  '</div></details>';
  if(w&&!f.lowPriceConfirmed&&f.showWarn){
    html+='<div class="notice n-warn" style="margin-top:12px" role="alert">'+ICON.warn+'<div><strong>'+zl(w.price)+'/'+esc(w.unit)+' — ostatnio '+zl(w.last)+'/'+esc(w.unit)+'.</strong> Sprawdź, czy cena jest poprawna.'+
      '<div class="actions"><button type="button" class="btn btn-secondary" data-act="form-fix-price">Popraw cenę</button><button type="button" class="btn btn-primary" data-act="form-publish" data-confirm="1">Opublikuj za '+zl(w.price)+'</button></div></div></div>';
  }
  html+='<div class="actions" style="margin-top:16px"><button type="submit" class="btn btn-primary btn-lg" data-act="form-publish">'+esc(pub)+'</button><button type="button" class="btn btn-secondary" data-act="form-draft">Zapisz na później</button></div>'+
    '<p class="pub-sum">Po publikacji cena i warunki są stałe. Sklepy z grupy dostaną krótkie powiadomienie bez ceny.</p>';
  html+='</form><aside><div class="preview-frame card"><p class="small muted" style="margin-bottom:10px">Tak zobaczy to sklep</p>'+livePreview(f,now)+'</div></aside></div>';
  return {html,back:'#/supplier/new',tab:null,after(){ if(f.focus){ const el=$('#'+f.focus); if(el){ el.focus(); if(el.select) el.select(); } delete f.focus; } }};
}
function livePreview(f,now){
  const p=product(f.productId); const price=parsePrice(f.price); const end=computeEnd(f,now); const pool=parseInt(f.pool,10)||0;
  return '<div class="offer-card" style="padding:0;border:0"><div class="thumb">'+art(p.art)+'</div><div class="oc-body"><div class="oc-top"><span>'+esc(S.supplier.name)+'</span><span>'+(Number.isFinite(end)&&end>now?countdown(end,now):'—')+'</span></div><div class="oc-name">'+esc(p.name)+' <span class="oc-variant">'+esc(p.variant)+'</span></div>'+
    '<div class="oc-bottom"><span class="oc-price num">'+(price>0?zl(price):'—')+'<small>/'+esc(p.unit)+' netto</small></span><span class="oc-meta">'+esc(packName(p.pack,true))+' '+unitsOf(p.pack.size,p.unit)+' · min. '+(parseInt(f.min,10)||0)+'</span></div></div></div>'+
    '<p class="small muted" style="margin-top:10px">Powiadomienie: <em>Nowa oferta: '+esc(p.name)+' — '+esc(S.supplier.name)+(Number.isFinite(end)?' · '+esc(endsLabel(end,now)):'')+'</em></p>';
}
function publishForm(confirmLow){
  const f=S.ui.form; if(!f) return; const now=Date.now(); const e=validateForm(f,now);
  if(Object.keys(e).length){ f.errors=e; f.open=e.min?'min':e.end?'end':e.fulfil?'fulfil':e.group?'group':null; f.focus=e.price?'f-price':e.pool?'f-pool':null; save(); render(); return; }
  const w=priceWarning(f);
  if(w&&!confirmLow&&!f.lowPriceConfirmed){ f.showWarn=true; save(); render(); const n=$('.notice.n-warn'); if(n) n.scrollIntoView({block:'center'}); return; }
  const o=offerFromForm(f,now); S.offers.unshift(o);
  product(f.productId).lastPriceNet=o.priceNet;
  if(f.draftId){ const i=S.offers.findIndex(x=>x.id===f.draftId); if(i>=0) S.offers.splice(i,1); }
  S.ui.form=null; S.ui.search=''; save(); go('#/supplier/offers?published='+o.id);
}
function saveDraft(){
  const f=S.ui.form; if(!f) return; const now=Date.now(); const p=product(f.productId);
  let d=f.draftId?offer(f.draftId):null;
  if(!d){ d={id:'o'+(S.seq.offer++),status:'draft',supplierId:SUP_ID,createdAt:now}; S.offers.unshift(d); f.draftId=d.id; }
  d.name=p.name; d.art=p.art; d.createdAt=now; d.form=clone(Object.assign({},f,{errors:{},open:null,lowPriceConfirmed:false,showWarn:false,focus:null}));
  S.ui.form=null; save(); toast('Zapisano na później.'); go('#/supplier/offers');
}

/* ======================= PUSH (symulacja) ======================= */
let pushTimer=null;
function simulatePush(){
  const now=Date.now(); const cands=S.offers.filter(shopSees).sort((a,b)=>b.createdAt-a.createdAt);
  const o=cands.find(x=>['active','lowstock'].includes(offerState(x,now)))||cands[0];
  if(!o){ toast('Brak ofert do powiadomienia.'); return; }
  hidePush();
  $('#push-layer').innerHTML='<div class="push" role="status"><button type="button" class="push-body" data-act="push-open" data-id="'+o.id+'" aria-label="Otwórz ofertę: '+esc(o.name)+'"><div class="push-icon">'+ICON.tag+'</div><div class="push-text"><div class="push-app"><span>Okazje B2B</span><span>teraz</span></div><div class="push-title">Nowa oferta: '+esc(o.name)+'</div><div class="push-line">'+esc(o.supplierName)+' · '+esc(endsLabel(o.endsAt,now))+'</div></div></button><button type="button" class="push-close" data-act="push-close" aria-label="Zamknij powiadomienie">'+ICON.x+'</button></div>';
  pushTimer=setTimeout(hidePush,14000);
}
function hidePush(){ clearTimeout(pushTimer); $('#push-layer').innerHTML=''; }
let toastTimer=null;
function toast(msg){ const l=$('#toast-layer'); l.innerHTML='<div class="toast">'+esc(msg)+'</div>'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ l.innerHTML=''; },4200); }

/* ======================= PASEK DEMO ======================= */
function renderDemo(){
  const r=parseRoute(); const role=r.role==='supplier'?'supplier':'shop';
  const el=$('#demo'); if(!el) return;
  let html='<span class="demo-tag">DEMO</span><span class="demo-who">Wersja demonstracyjna — fikcyjne dane i płatności · <strong>'+(role==='shop'?'Sklep „Pod Lipą”':'Producent Borowik')+'</strong></span>'+
    '<button type="button" class="demo-open" data-act="demo-toggle" aria-expanded="'+(S.ui.demoOpen?'true':'false')+'" aria-controls="demo-panel">Sterowanie '+(S.ui.demoOpen?'▴':'▾')+'</button>';
  if(S.ui.demoOpen){
    html+='<div class="demo-panel" id="demo-panel" role="dialog" aria-label="Panel demonstracyjny"><h2>Panel demonstracyjny — poza aplikacją</h2>'+
      '<div class="field" style="margin-bottom:12px"><span class="lbl" id="demo-role-l">Oglądasz jako</span><div class="seg" role="radiogroup" aria-labelledby="demo-role-l"><label><input type="radio" name="demo-role" data-demo-role="shop"'+(role==='shop'?' checked':'')+'><span>Sklep „Pod Lipą”</span></label><label><input type="radio" name="demo-role" data-demo-role="supplier"'+(role==='supplier'?' checked':'')+'><span>Producent Borowik</span></label></div></div>'+
      '<div class="stack"><button type="button" class="btn btn-secondary btn-block" data-act="demo-push">'+ICON.bell+' Symuluj powiadomienie do sklepu</button>'+
      '<label class="check"><input type="checkbox" data-act="demo-fail"'+(S.ui.failNextPayment?' checked':'')+'> Następna płatność kończy się błędem</label>'+
      '<button type="button" class="btn btn-secondary btn-block" data-act="demo-reset">Resetuj makietę</button></div>'+
      '<p class="demo-note">Sklep „Pod Lipą” należy do grup: Sklepy lokalne — Kraków, Małopolska — wszystkie sklepy.</p>'+
      '<details class="demo-note"><summary style="cursor:pointer">Źródła zdjęć (Wikimedia Commons)</summary><ul style="margin:6px 0 0;padding-left:16px">'+Object.keys(PHOTO_CREDITS).map(k=>'<li>'+esc(PHOTO_CREDITS[k][0])+' — '+esc(PHOTO_CREDITS[k][2])+', '+esc(PHOTO_CREDITS[k][1])+'</li>').join('')+'</ul></details></div>';
  }
  el.innerHTML=html;
}

/* ======================= ZDARZENIA ======================= */
document.addEventListener('click',e=>{
  const link=e.target.closest('a[href^="#/"]');
  if(link&&!e.defaultPrevented&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey&&!e.altKey&&e.button===0){ e.preventDefault(); go(link.getAttribute('href')); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act; const r=parseRoute();
  const curOffer=()=>offer(r.id); const f=S.ui.form;
  switch(act){
    case 'qty-dec': case 'qty-inc': case 'qty-set': { const o=curOffer(); if(!o) return; const cur=parseInt(S.ui.qtyByOffer[o.id],10); let n; if(act==='qty-set') n=parseInt(a.dataset.val,10); else { const base=Number.isFinite(cur)?cur:o.min-(act==='qty-inc'?1:0); n=act==='qty-inc'?base+1:base-1; } if(n<1) n=1; S.ui.qtyByOffer[o.id]=String(n); patchBuy(o); break; }
    case 'buy': { e.preventDefault(); if(a.getAttribute('aria-disabled')==='true'){ const o=offer(a.dataset.id); if(o){ patchBuy(o); const i=$('#qty-input'); if(i) i.focus(); } return; } const o=offer(a.dataset.id); if(o) startPay(o); break; }
    case 'pay-cancel': cancelPay(); break;
    case 'close-ask': S.ui.confirmClose=a.dataset.id; save(); render(); setTimeout(()=>{ const b=$('[data-act="close-do"]'); if(b) b.focus(); },0); break;
    case 'close-cancel': S.ui.confirmClose=null; save(); render(); break;
    case 'close-do': { const o=offer(a.dataset.id); if(o){ o.status='closed'; o.closedAt=Date.now(); } S.ui.confirmClose=null; save(); render(); toast('Oferta zakończona. Opłacone zamówienia pozostają ważne.'); break; }
    case 'cond-open': { if(!f) return; const k=a.dataset.key; f.open=f.open===k?null:k; if(f.open) delete f.errors[k]; save(); render(); if(f.open){ const el=$('.panel input'); if(el) el.focus(); } else { const b=$('[data-act="cond-open"][data-key="'+k+'"]'); if(b) b.focus(); } break; }
    case 'min-dec': case 'min-inc': { if(!f) return; let n=parseInt(f.min,10)||0; n+=act==='min-inc'?1:-1; if(n<1) n=1; f.min=n; delete f.errors.min; save(); render(); const b=$('[data-act="'+act+'"]'); if(b) b.focus(); break; }
    case 'form-publish': e.preventDefault(); publishForm(!!a.dataset.confirm); break;
    case 'form-fix-price': if(f){ f.showWarn=false; f.focus='f-price'; save(); render(); } break;
    case 'form-draft': saveDraft(); break;
    case 'push-open': hidePush(); S.ui.demoOpen=false; go('#/shop/offer/'+a.dataset.id); break;
    case 'push-close': hidePush(); break;
    case 'demo-toggle': S.ui.demoOpen=!S.ui.demoOpen; save(); break;
    case 'demo-push': S.ui.demoOpen=false; save(); simulatePush(); break;
    case 'demo-reset': S.ui.demoOpen=false; resetAll(); break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-demo-role]')){ S.ui.demoOpen=false; S.ui.confirmClose=null; save(); go(t.dataset.demoRole==='shop'?'#/shop/offers':'#/supplier/offers'); return; }
  if(t.matches('[data-act="demo-fail"]')){ S.ui.failNextPayment=t.checked; save(); return; }
  if(t.matches('[data-f]')){ const f=S.ui.form; if(!f) return; const name=t.dataset.f; f[name]=t.value;
    if(name==='endMode'||name==='fulfilId'||name==='groupId'){ delete f.errors[name==='endMode'?'end':name==='fulfilId'?'fulfil':'group']; if(name!=='endMode') f.open=null; save(); render(); if(name==='endMode'){ const el=f.endMode==='custom'?$('#f-end-custom'):$('input[name="endMode"]:checked'); if(el) el.focus(); } else { const b=$('[data-act="cond-open"][data-key="'+(name==='fulfilId'?'fulfil':'group')+'"]'); if(b) b.focus(); } return; }
    if(name==='min'){ const n=parseInt(t.value,10); f.min=n>=1?n:1; save(); render(); return; }
    save(); }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('[data-qty]')){ const o=offer(t.dataset.qty); if(!o) return; S.ui.qtyByOffer[o.id]=t.value; patchBuy(o); return; }
  if(t.matches('[data-search]')){ S.ui.search=t.value; storage.set(JSON.stringify(S)); focusSearch=true; render(); return; }
  if(t.matches('[data-f]')){ const f=S.ui.form; if(!f) return; const name=t.dataset.f; f[name]=t.value; f.showWarn=false; f.lowPriceConfirmed=false;
    if(f.errors[name]){ delete f.errors[name]; const fld=t.closest('.field'); if(fld){ fld.classList.remove('invalid'); const er=fld.querySelector('.err'); if(er) er.remove(); } t.removeAttribute('aria-invalid'); }
    if(name==='price'||name==='pool'){ const p=product(f.productId); const price=parsePrice(f.price); const pool=/^\d+$/.test(String(f.pool).trim())?parseInt(f.pool,10):NaN;
      const ph=$('#price-hint'); if(ph) ph.textContent=price>0?packName(p.pack,true)+' '+unitsOf(p.pack.size,p.unit)+' = '+zl(price*p.pack.size)+' netto'+(p.lastPriceNet?' · ostatnio '+zl(p.lastPriceNet)+'/'+p.unit:''):(p.lastPriceNet?'Ostatnio '+zl(p.lastPriceNet)+'/'+p.unit:'Pierwsza oferta tego produktu');
      const qh=$('#pool-hint'); if(qh) qh.textContent=pool>=1?'= '+unitsOf(pool*p.pack.size,p.unit)+' · wartość '+zl(pool*p.pack.size*(price>0?price:0))+' netto':'Podaj ilość tej partii';
      const aside=$('.form-layout aside .preview-frame'); if(aside){ const pv=aside.querySelector('.offer-card'); if(pv){ const tmp=document.createElement('div'); tmp.innerHTML=livePreview(f,Date.now()); aside.innerHTML='<p class="small muted" style="margin-bottom:10px">Tak zobaczy to sklep</p>'+tmp.innerHTML; } }
      const warn=$('.notice.n-warn[role=alert]'); if(warn) warn.remove(); }
    storage.set(JSON.stringify(S)); }
});
document.addEventListener('focusin',e=>{ if(e.target.matches('[data-qty]')) document.body.classList.add('kb'); });
document.addEventListener('focusout',e=>{ if(e.target.matches('[data-qty]')) document.body.classList.remove('kb'); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(S.ui.demoOpen){ S.ui.demoOpen=false; save(); $('.demo-open').focus(); } if($('.push')) hidePush(); if(S.ui.pay&&S.ui.pay.phase==='failed') cancelPay(); }
  if(e.key==='Enter'&&e.target.matches('[data-qty]')){ e.preventDefault(); const b=$('#buy-cta'); if(b) b.click(); }
});
document.addEventListener('submit',e=>{ if(e.target.id==='offer-form'){ e.preventDefault(); publishForm(false); } });
window.addEventListener('hashchange',()=>{ if(/^#\//.test(location.hash)&&location.hash!==ROUTE){ ROUTE=location.hash; S.ui.route=ROUTE; render(); } });

/* odświeżanie odliczania i stanów co 30 s */
let lastStates='';
setInterval(()=>{ const now=Date.now(); $$('[data-countdown]').forEach(el=>{ el.textContent=countdown(parseInt(el.dataset.countdown,10),now); });
  const r=parseRoute(); if(r.page==='compose'||S.ui.pay) return;
  const sig=S.offers.map(o=>o.id+':'+offerState(o,now)).join(','); if(lastStates&&sig!==lastStates) render(); lastStates=sig; },30000);

/* start */
ROUTE=(/^#\//.test(location.hash)?location.hash:null)||S.ui.route||'#/shop/offers';
try{ if(location.hash!==ROUTE) history.replaceState(null,'',ROUTE); }catch(e){}
render();
})();
</script>
